{% extends "base.html" %}
{% block title %}{{ 'Edit' if editing else 'Add' }} expense — Spendly{% endblock %}
{% block content %}
<section class="auth-section"><div class="auth-container">
    <div class="auth-header"><h1 class="auth-title">{{ 'Edit' if editing else 'Add' }} expense</h1>
        <p class="auth-subtitle">Keep track of where your money goes.</p></div>
    <div class="auth-card">
        {% if error %}<div class="auth-error" role="alert">{{ error }}</div>{% endif %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ expense_token() }}">
            <div class="form-group"><label for="amount">Amount (₹)</label>
                <input class="form-input" id="amount" name="amount" type="number" min="0.01" max="999999999.99" step="0.01" value="{{ values.amount or '' }}" required autofocus></div>
            <div class="form-group"><label for="category">Category</label>
                <select class="form-input" id="category" name="category" required>
                    <option value="">Choose a category</option>
                    {% for category in categories %}<option value="{{ category }}" {% if values.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}
                </select></div>
            <div class="form-group"><label for="date">Date</label>
                <input class="form-input" id="date" name="date" type="date" max="{{ today }}" value="{{ values.date }}" required></div>
            <div class="form-group"><label for="description">Description (optional)</label>
                <input class="form-input" id="description" name="description" maxlength="500" value="{{ values.description or '' }}"></div>
            <button class="btn-submit" type="submit">Save expense</button>
        </form>
    </div>
    <p class="auth-switch"><a href="{{ url_for('profile') }}">Cancel and return to dashboard</a></p>
</div></section>
{% endblock %}
